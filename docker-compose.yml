version: '3.8'

services:
  postgres:
    image: postgres:latest
    container_name: library-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: librarydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - library-network
volumes:
  postgres_data:
    driver: local

networks:
  library-network:
    driver: bridge